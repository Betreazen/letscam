[package]
name = "letscam-engine"
version = "0.1.2"
edition = "2024"
publish = false
description = "LetsCam: engine-independent recording, director camera and ffmpeg encoding"

[lib]
name = "letscam_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
cpal = "0.16"
crossbeam-queue = "0.3"
png = "0.18"
log = "0.4"
parking_lot = "0.12"

# Game audio: WASAPI process loopback of our own process tree.
# windows/windows-core 0.62.2 are already in Horizon's Cargo.lock; features add no packages.
# windows-core is a direct dependency because #[implement] expands to `::windows_core` paths.
# Plain [dependencies]: horizon-mixins refuses [target] tables in a bundle crate; the code that
# uses them is cfg(windows).
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62.2"
